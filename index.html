<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f4f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;background:#f3f4f6}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);max-width:460px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;color:#222}
.bar .grp{display:flex;align-items:center;gap:30px}
.bar svg{display:block}
.sci{font-size:12px;font-weight:700;line-height:1.05;text-align:left}
.display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:12px 26px 22px;min-height:0}
.hist{font-size:22px;color:#8b8f97;min-height:30px;white-space:nowrap}
.cur{font-size:84px;font-weight:400;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cur.m{font-size:60px}.cur.s{font-size:40px}
.panel{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px))}
button{width:100%;aspect-ratio:1;border:0;border-radius:50%;font:inherit;font-size:36px;font-weight:400;color:#111;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(20,25,40,.05);transition:transform .08s,filter .08s}
button:active{transform:scale(.94);filter:brightness(.95)}
button:focus-visible{outline:3px solid #ff6a1a;outline-offset:2px}
.fn,.op{background:#e5e6ea;box-shadow:none}
.fn{font-size:34px;font-weight:500}
.op{font-size:42px}
.op.sel{background:#ffe0cc;color:#e8550a}
.eq{background:#ff6a1a;color:#fff;font-size:44px;box-shadow:none}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#dlg.open{display:flex}
.card{background:#fff;color:#111;border-radius:20px;padding:20px;width:100%;max-width:320px}
.card h2{margin:0 0 12px;font-size:18px;font-weight:500}
.card input{width:100%;font-size:22px;padding:10px 12px;border:1px solid #cfd2d8;border-radius:12px;-webkit-user-select:text;user-select:text}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.row button{width:auto;aspect-ratio:auto;height:44px;padding:0 18px;font-size:16px;font-weight:500;border-radius:12px;background:#eceef1;box-shadow:none}
.row .save{background:#ff6a1a;color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="bar" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l6-6M4 14v6h6M20 4l-6 6M20 10V4h-6"/></svg>
    <div class="grp">
      <div class="sci">√ π<br>e =</div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </div>
  </div>

  <div class="display" id="display">
    <div class="hist" id="hist"></div>
    <div class="cur" id="cur">0</div>
  </div>

  <div class="panel" id="keys">
    <button class="fn" data-a="clear">AC</button>
    <button class="fn" data-a="percent">%</button>
    <button class="fn" data-a="back" aria-label="Delete"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    <button class="op" data-a="op" data-v="÷">÷</button>
    <button data-a="num" data-v="7">7</button>
    <button data-a="num" data-v="8">8</button>
    <button data-a="num" data-v="9">9</button>
    <button class="op" data-a="op" data-v="×">×</button>
    <button data-a="num" data-v="4">4</button>
    <button data-a="num" data-v="5">5</button>
    <button data-a="num" data-v="6">6</button>
    <button class="op" data-a="op" data-v="−">−</button>
    <button data-a="num" data-v="1">1</button>
    <button data-a="num" data-v="2">2</button>
    <button data-a="num" data-v="3">3</button>
    <button class="op" data-a="op" data-v="+">+</button>
    <button data-a="num" data-v="00">00</button>
    <button data-a="num" data-v="0">0</button>
    <button data-a="dot" aria-label="Decimal point">.</button>
    <button class="eq" data-a="eq">=</button>
  </div>
</div>

<div id="dlg">
  <div class="card">
    <h2>Secret answer</h2>
    <input id="secretInput" type="text" inputmode="decimal" autocomplete="off">
    <div class="row">
      <button id="cancel">Cancel</button>
      <button id="save" class="save">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cur="0",prev=null,op=null,fresh=false,hist="",secret="999";
  try{secret=localStorage.getItem("secret")||"999";}catch(e){}
  var curEl=document.getElementById("cur"),histEl=document.getElementById("hist");
  var opBtns=document.querySelectorAll(".op");

  function render(){
    curEl.textContent=cur;
    histEl.textContent=hist;
    var n=cur.length;
    curEl.className="cur"+(n>11?" s":n>8?" m":"");
    for(var i=0;i<opBtns.length;i++){
      opBtns[i].classList.toggle("sel",op===opBtns[i].dataset.v&&fresh);
    }
  }
  function calc(a,b,o){
    var x=parseFloat(a),y=parseFloat(b),r;
    // TRICK: koi bhi number x 123 (ya 123 x number) => aapka secret answer
    if(o==="×"&&(x===123||y===123))return secret;
    if(o==="+")r=x+y;
    else if(o==="−")r=x-y;
    else if(o==="×")r=x*y;
    else if(o==="÷"){if(y===0)return "Error";r=x/y;}
    if(!isFinite(r))return "Error";
    return String(parseFloat(r.toPrecision(12)));
  }
  function num(d){
    if(cur==="Error"||fresh){cur="0";fresh=false;}
    if(cur.replace(/[-.]/g,"").length+d.length>15)return;
    cur=(cur==="0")?(d==="00"?"0":d):cur+d;
  }
  function dot(){
    if(cur==="Error"||fresh){cur="0";fresh=false;}
    if(cur.indexOf(".")<0)cur+=".";
  }
  function setOp(o){
    if(cur==="Error")return;
    if(op&&!fresh){cur=calc(prev,cur,op);if(cur==="Error"){op=null;prev=null;hist="";return;}}
    prev=cur;op=o;fresh=true;hist=cur+" "+o;
  }
  function eq(){
    if(!op||cur==="Error")return;
    var a=prev,b=cur,o=op;
    cur=calc(a,b,o);hist=a+" "+o+" "+b+" =";
    op=null;prev=null;fresh=true;
  }
  function clr(){cur="0";prev=null;op=null;fresh=false;hist="";}
  function back(){
    if(cur==="Error"||fresh)return;
    cur=(cur.length>1&&!(cur.length===2&&cur[0]==="-"))?cur.slice(0,-1):"0";
  }
  function pct(){
    if(cur==="Error")return;
    cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12)));
  }

  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    try{if(navigator.vibrate)navigator.vibrate(8);}catch(x){}
    var a=b.dataset.a,v=b.dataset.v;
    if(a==="num")num(v);
    else if(a==="dot")dot();
    else if(a==="op")setOp(v);
    else if(a==="eq")eq();
    else if(a==="clear")clr();
    else if(a==="back")back();
    else if(a==="percent")pct();
    render();
  });

  var dlg=document.getElementById("dlg"),inp=document.getElementById("secretInput");
  function openDlg(){inp.value=secret;dlg.classList.add("open");setTimeout(function(){inp.focus();},50);}
  function closeDlg(){dlg.classList.remove("open");}
  document.getElementById("cancel").addEventListener("click",closeDlg);
  document.getElementById("save").addEventListener("click",function(){
    var v=inp.value.trim();
    if(v!==""&&isFinite(Number(v))){
      secret=v;
      try{localStorage.setItem("secret",secret);}catch(e){}
    }
    closeDlg();
  });

  // Display ko lamba dabayein => secret answer set karne ka box khulega
  var timer=null,disp=document.getElementById("display");
  function start(){clearTimeout(timer);timer=setTimeout(openDlg,600);}
  function stop(){clearTimeout(timer);}
  disp.addEventListener("pointerdown",start);
  disp.addEventListener("pointerup",stop);
  disp.addEventListener("pointerleave",stop);
  disp.addEventListener("pointercancel",stop);
  disp.addEventListener("contextmenu",function(e){e.preventDefault();});

  render();
})();
</script>
</body>
</html>
